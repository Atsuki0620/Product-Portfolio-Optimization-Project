version: "6.0"
description: "Product Portfolio Optimization Framework v6"
author: "analyst_claude_v6"
created_date: "2025-12-07"

# ============================================================================
# 拠点キャパシティ（単位: 本）
# ============================================================================
plant_capacity:
  A: 300000
  B: 204000

# ============================================================================
# 総販売目標（単位: 本）
# ============================================================================
total_sales_target: 504000

# ============================================================================
# 市場予測期間
# ============================================================================
market_forecast:
  target_period: 1  # 年数（1年後の目標）
  # 注: CAGRはmarket_master.csvで定義されている値をそのまま使用

# ============================================================================
# 戦略係数（事業部長のビジネス感覚に基づく）
# ============================================================================
strategy_coefficients:
  aggressive_expansion:
    lower: 1.0
    upper: 1.2  # 年間20%拡大は現実的（v5: 1.5→1.2に修正）
    description: "1年で20%までのシェア拡大を目指す"

  maintain:
    lower: 0.95
    upper: 1.05  # 維持戦略の範囲を縮小（v5: 0.9-1.1）
    description: "現状シェアの±5%以内で維持"

  reduction:
    lower: 0.9
    upper: 1.0  # 縮小でも微増を許容（v5: 0.5-1.0）
    description: "段階的縮小、最大10%減"

  withdrawal:
    lower: 0.7
    upper: 0.9  # 段階的撤退（v5: 0.0-0.7）
    description: "1年で最大30%縮小"

# ============================================================================
# 競合奪取可能率（1年用に調整）
# 3年分の値を1/3に縮小して1年分に調整
# ============================================================================
acquisition_rates:
  strong:
    lower: 0.000
    upper: 0.010  # 3年: 0-3% → 1年: 0-1%
    description: "Strong競合からの奪取は困難"

  moderate:
    lower: 0.007
    upper: 0.017  # 3年: 2-5% → 1年: 0.7-1.7%
    description: "Moderate競合からは段階的に奪取"

  weak:
    lower: 0.017
    upper: 0.033  # 3年: 5-10% → 1年: 1.7-3.3%
    description: "Weak競合からは積極的に奪取"

# ============================================================================
# 自動調整パラメータ（A-3改善提案）
# ============================================================================
auto_adjustment:
  enabled: true
  max_iterations: 5
  reduction_rate: 0.05  # 5%ずつ引き下げ
  description: "実行可能性検証で失敗した場合、目標を段階的に引き下げる"

# ============================================================================
# 診断機能パラメータ（A-4改善提案）
# ============================================================================
diagnostics:
  enabled: true
  pre_optimization_check: true
  capacity_utilization_threshold: 0.8  # キャパシティ活用率の警告閾値
  description: "最適化実行前に制約の充足可能性を診断"

# ============================================================================
# データ検証パラメータ（A-6改善提案: Fail-Fast原則）
# ============================================================================
data_validation:
  enabled: true
  check_negative_values: true
  check_null_values: true
  check_range_values: true
  description: "各ステップで出力データを検証し、異常時は即座に停止"

# ============================================================================
# 代理店モデルパラメータ
# ============================================================================
distributor_model:
  # 顧客セグメント分布の目標
  target_distribution:
    single_segment: 0.6   # 60%
    multi_segment: 0.4    # 40% (2-3セグメント)

  # 顧客別価格変動範囲
  price_variation:
    min_multiplier: 0.9   # 基準価格の90%
    max_multiplier: 1.1   # 基準価格の110%

  # 顧客別コスト変動範囲
  cost_variation:
    min_multiplier: 0.95  # 基準コストの95%
    max_multiplier: 1.05  # 基準コストの105%

  # 製品×拠点×セグメントあたりの顧客割り当て数
  customers_per_combination:
    min: 1
    max: 3

# ============================================================================
# ファイルパス設定
# ============================================================================
paths:
  config_dir: "config"
  data_raw_dir: "data/raw"
  data_master_dir: "data/master"
  data_processed_dir: "data/processed"
  scripts_dir: "scripts"
  reports_dir: "reports"

# ============================================================================
# ログ設定
# ============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "optimization.log"
